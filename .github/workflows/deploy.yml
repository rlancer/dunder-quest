name: Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/godot-web
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-templates-v2

      - name: Build the site and the browser game
        run: bash scripts/export_web.sh

      - name: Export the desktop builds
        run: bash scripts/export_desktop.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install the deploy CLI
        working-directory: deploy
        run: bun install --frozen-lockfile

      - name: Check the build
        if: github.event_name == 'pull_request'
        working-directory: deploy
        run: npx --no-install cf deploy --mode ${{ github.base_ref == 'main' && 'production' || 'dev' }} --dry-run

      - name: Deploy dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: deploy
        run: npx --no-install cf deploy --mode dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: deploy
        run: npx --no-install cf deploy --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install the stats app
        working-directory: stats
        run: bun install --frozen-lockfile

      - name: Check the stats app
        working-directory: stats
        run: bun run typecheck && bun run build

      # Skipped until the D1 database exists and its id is in stats/wrangler.jsonc.
      - name: Deploy stats
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: stats
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::notice::Stats not deployed: set database_id in stats/wrangler.jsonc (see stats/README.md)."
            exit 0
          fi
          npx --no-install wrangler d1 migrations apply ember-trail-stats --remote
          npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish desktop downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f builds
          git push -f origin refs/tags/builds
          notes="Desktop builds of Ember Trail from ${GITHUB_SHA::7}. Rebuilt on every push to main. Play in the browser at https://ember-trail.robertlancer.com"
          if gh release view builds >/dev/null 2>&1; then
            gh release upload builds build/downloads/* --clobber
            gh release edit builds --notes "$notes"
          else
            gh release create builds build/downloads/* --title "Ember Trail desktop builds" --notes "$notes" --latest
          fi
