name: Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/godot-web
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-templates-v2

      - name: Check the Flatmates.js lesson cards
        run: node games/flatmates/tests/verify_lessons.mjs

      # The site build and its checks run on bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Build the site and the browser games
        run: bash scripts/export_web.sh

      # Plays every scene and compiles every plan, in every combination of
      # its blanks, with the runner's rustc, to hold the in-game checker to it.
      - name: Check Curb Your Oxidation against rustc
        run: GODOT="$HOME/.cache/godot-web/Godot_v4.7.2-stable_linux.x86_64" bash games/curb/tests/check.sh

      # Replays every room's solution, and a set of wrong turns, through the
      # in-game Git and then through the runner's real git, and demands the same
      # commit ids, files, conflicts and output. Then the bot plays every room.
      - name: Check Prince of Versions against git
        run: GODOT="$HOME/.cache/godot-web/Godot_v4.7.2-stable_linux.x86_64" bash games/prince/tests/check.sh

      # Runs every question's solution, and every query the chips on its page
      # can spell, through the in-game SQL engine and then through the real
      # SQLite (bun's own), and demands the same rows, columns and errors.
      # Then the bot plays the prologue and every case, and every screen is
      # checked for text that breaks out of its panel.
      - name: Check Just One More JOIN against SQLite
        run: GODOT="$HOME/.cache/godot-web/Godot_v4.7.2-stable_linux.x86_64" bash games/lieutenant/tests/check.sh

      # Runs every poster's solution, and every pattern shorter than it, through
      # the game's regex engine and then through JavaScript's RegExp (bun's
      # own), and demands the same matches and groups. Then the bot plays the
      # prologue and every job, and every screen is checked for text that
      # breaks out of its panel.
      - name: Check The Good, the Bad and the Greedy against RegExp
        run: GODOT="$HOME/.cache/godot-web/Godot_v4.7.2-stable_linux.x86_64" bash games/greedy/tests/check.sh

      # Runs every ticket's solution, and every line shorter than it, through
      # the game's shell and then through the runner's real bash and
      # coreutils, and demands the same output, the same files and the same
      # errors. Then the bot plays the prologue and every shift, and every
      # screen is checked for text that breaks out of its panel.
      - name: Check Yes, Shell! against bash
        run: GODOT="$HOME/.cache/godot-web/Godot_v4.7.2-stable_linux.x86_64" bash games/shell/tests/check.sh

      # Sends every request every scene's cards can make, every lesson card's
      # and a set of probes at every counter, to the game's own HTTP, then to a
      # real HTTP server (Bun.serve) with real fetch, and demands the same
      # status, reason, headers, body and data left behind. Then the bot plays
      # the prologue and every episode, and every screen is checked for text
      # that breaks out of its panel.
      - name: Check A Game About Nothing against a real HTTP server
        run: GODOT="$HOME/.cache/godot-web/Godot_v4.7.2-stable_linux.x86_64" bash games/nothing/tests/check.sh

      - name: Export the desktop builds
        run: bash scripts/export_desktop.sh

      - name: Install the deploy CLI
        working-directory: deploy
        run: bun install --frozen-lockfile

      # The social layer's Worker (deploy/src): players, saves, leaderboards,
      # certificates, screenshots and Google sign-in, against bun:sqlite.
      - name: Test the social API
        working-directory: deploy
        run: bun test test

      - name: Check the build
        if: github.event_name == 'pull_request'
        working-directory: deploy
        run: npx --no-install cf deploy --mode ${{ github.base_ref == 'main' && 'production' || 'dev' }} --dry-run

      # Every push to a PR also goes to dev.dunderquest.com, so it can be tried
      # before merging. There's one dev site, so the latest push to any PR
      # wins. PRs from forks get no secrets, so they stop at the check above.
      - name: Deploy the PR to dev
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: deploy
        run: |
          npx --no-install cf deploy --mode dev --message "PR #$PR at ${HEAD_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Link the dev deploy on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Deployed \`${HEAD_SHA::7}\` to **https://dev.dunderquest.com/**. It's one dev site for every PR, so a later push to another PR replaces it."

      - name: Deploy dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: deploy
        run: npx --no-install cf deploy --mode dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: deploy
        run: npx --no-install cf deploy --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install the stats app
        working-directory: stats
        run: bun install --frozen-lockfile

      - name: Check the stats app
        working-directory: stats
        run: bun run typecheck && bun run build

      - name: Publish desktop downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f builds
          git push -f origin refs/tags/builds
          notes="Desktop builds of Dunder Quest from ${GITHUB_SHA::7}. Rebuilt on every push to main. Play in the browser at https://dunderquest.com"
          if gh release view builds >/dev/null 2>&1; then
            gh release upload builds build/downloads/* --clobber
            gh release edit builds --notes "$notes"
          else
            gh release create builds build/downloads/* --title "Dunder Quest desktop builds" --notes "$notes" --latest
          fi

      # Last, so a stats problem never holds back the game or its downloads.
      # Skipped until the D1 database exists and its id is in stats/wrangler.jsonc.
      - name: Deploy stats
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: stats
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::notice::Stats not deployed: set database_id in stats/wrangler.jsonc (see stats/README.md)."
            exit 0
          fi
          npx --no-install wrangler d1 migrations apply ember-trail-stats --remote
          npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
