html/custom_html_shell=""
html/head_include="<style>html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#canvas{touch-action:none}</style><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><script>(function(){var touch=matchMedia('(pointer: coarse)');function go(){if(!touch.matches||document.fullscreenElement||document.webkitFullscreenElement||innerWidth<innerHeight)return;var e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)Promise.resolve(f.call(e,{navigationUI:'hide'})).catch(function(){});}addEventListener('touchend',go,{capture:true,passive:true});addEventListener('click',go,true);})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
